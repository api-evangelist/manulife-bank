actions:
  apisYmlApis: 0
  reason: |
    Identity-only (built-stub) record. No first-party public API, developer
    portal, or downloadable specification exists to catalog. Consumer data
    access is aggregator-only pending Canada's not-yet-live Consumer-Driven
    Banking framework.
