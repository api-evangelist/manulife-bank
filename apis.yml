name: Manulife Bank
kind: company
description: >-
  Manulife Bank of Canada is a Schedule I federally chartered bank and a
  wholly-owned subsidiary of The Manufacturers Life Insurance Company, part of
  Manulife Financial Corporation. Launched in 1993 as Canada's first branchless
  (direct) bank — and the first federally regulated bank opened by an insurance
  company in Canada — it operates entirely through online banking, a mobile app,
  and telephone banking, with no physical branches. It is best known for the
  Manulife One all-in-one account, the Advantage Account, GICs, mortgages, and
  lines of credit that connect everyday banking and borrowing with long-term
  financial planning. Manulife Bank publishes no first-party public developer
  portal or downloadable API specifications; no developer.manulifebank.ca host
  resolves, and the public site is bot-protected. Canada's Consumer-Driven
  Banking (open-banking) framework — legislated in Budget 2024 and the Fall
  Economic Statement 2024, with the Financial Consumer Agency of Canada (FCAC)
  as overseer — is legislated but not yet operational, so consumer financial
  data access today is voluntary and occurs through financial-data aggregators
  (Plaid, Flinks, MX) rather than a first-party bank API. Interac e-Transfer is
  offered as a consumer feature but is not exposed as a documented public API.
